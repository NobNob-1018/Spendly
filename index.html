const FROM = "fabel.generated.v1";
const PALETTE = ["#007AFF","#34C759","#FF9500","#FF3B30","#AF52DE","#32ADE6","#FF2D55","#5856D6","#FFCC00","#00C7BE","#8E8E93","#A2845E"];
const DEFAULT_CATS = [
  ["housing","Housing","expense"], ["groceries","Groceries","expense"], ["dining","Dining","expense"],
  ["transport","Transport","expense"], ["utilities","Utilities","expense"], ["health","Health","expense"],
  ["shopping","Shopping","expense"], ["leisure","Leisure","expense"], ["travel","Travel","expense"],
  ["subscriptions","Subscriptions","expense"], ["education","Education","expense"], ["other","Other","expense"],
  ["salary","Salary","income"], ["business","Business","income"], ["interest","Interest","income"],
  ["gifts","Gifts","income"], ["other-income","Other income","income"]
].map(([id, name, kind], i) => ({ id, name, kind, color: PALETTE[i % PALETTE.length] }));
const ACCOUNT_TYPES = { bank:"Bank", cash:"Cash", wallet:"E-wallet", investment:"Investment" };
const TYPE_ICON = { bank:"bank", cash:"cash", wallet:"phone", investment:"growth" };

const blank = () => ({
  v: 1,
  settings: { theme:"system", density:"comfortable", currency:"PHP", period:"this-month", accent:"blue", bg:"plain", cardAlpha:100, edges:"none", corners:"round", textSize:100, motion:"system", perPage:50 },
  accounts: [], categories: DEFAULT_CATS.map(c => ({ ...c })), tx: [], loans: [], items: [], budgets: {},
  meta: { created: new Date().toISOString(), sample: false }
});
function load(){
  try{
    let raw = localStorage.getItem(KEY);
    if (!raw){ raw = localStorage.getItem(FROM); if (raw) localStorage.setItem(KEY, raw); }
    if (!raw) return blank();
    const d = JSON.parse(raw), b = blank();
    return { ...b, ...d, settings: { ...b.settings, ...(d.settings || {}) }, meta: { ...b.meta, ...(d.meta || {}) } };
  }catch(e){ return blank(); }
}
/* Sync bookkeeping lives here, so no call site has to think about it. A record
   whose content changed is stamped with the time (u). One that disappeared
   leaves a grave in S.gone, or the other device would hand it straight back.
   This sits above the loading of the books because priming runs the moment
   they are loaded: a device that primes late reads every record as just edited. */
const SYNCED = ["accounts", "categories", "tx", "loans", "items"];
let sigs = new Map();
const sigOf = r => JSON.stringify(r, (k, v) => k === "u" ? undefined : v);
function primeSigs(){
  sigs = new Map();
  SYNCED.forEach(k => (S[k] || []).forEach(r => sigs.set(k + ":" + r.id, sigOf(r))));
  Object.entries(S.budgets || {}).forEach(([c, v]) => sigs.set("b:" + c, String(v)));
}
/* `whole` is a replacement of the entire books (sample, erase, import): what
   was there before is not "deleted", so it leaves no graves. */
function stamp(o = {}){
  const now = Date.now(), live = new Map();
  S.gone = S.gone || {}; S.budgetU = S.budgetU || {};
  SYNCED.forEach(k => (S[k] || []).forEach(r => { const key = k + ":" + r.id, sig = sigOf(r); live.set(key, sig);
    if (sigs.get(key) !== sig) r.u = now;
    delete S.gone[r.id]; }));   /* a record that is here is not deleted */
  Object.entries(S.budgets || {}).forEach(([c, v]) => { live.set("b:" + c, String(v)); if (sigs.get("b:" + c) !== String(v)) S.budgetU[c] = now; });
  if (!o.whole) sigs.forEach((_, key) => { if (live.has(key)) return;
    if (key.startsWith("b:")) S.budgetU[key.slice(2)] = now; else S.gone[key.slice(key.indexOf(":") + 1)] = now; });

}
let S = load();
primeSigs();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ toast("Could not save — storage is full or blocked.", { tone:"neg" }); return false; }
}

/* Everything derived is memoised per version of the document. */
let memo = new Map();
const bump = () => { memo = new Map(); };
const cached = (k, fn) => { if (!memo.has(k)) memo.set(k, fn()); return memo.get(k); };

/* Every change goes through here, so every change can be undone and every
   change is stamped for sync. A change that cannot be made - its record went
   away under it, on another device - is put back whole, and says so. */
/* Each change keeps only the records it touched, as they were before and
   after, so it is small enough to keep, and can be taken back on its own
   later. A change that replaced the whole books (sample data, erase, import)
   keeps the whole copy instead, and lives only until the page closes.
   - The last five changes are saved on this device, so Undo still works after
     a refresh, or after the app was closed on a phone.
   - Every change to entries or loans also goes in the money log, which keeps
     them for good (the newest 300). Any one of them can be undone later, as
     long as nothing has changed the same record since and nothing would be
     left pointing at something gone.
   Undo right away takes a change back as if it never happened, so it leaves
   the log. Undoing an older one from the log is itself a change, which marks
   the old one undone and can be undone in turn. */
const past = [], future = [], log = [];
const JOURNAL = "opus.generated.journal", COLS = ["accounts", "tx", "loans", "categories", "items"];
const recSig = r => JSON.stringify(r, (k, v) => k === "u" ? undefined : v);
const keepRec = (c, r) => !(c === "tx" && r.auto === "interest");   /* interest is worked out again anyway */
const findRec = (c, id) => (S[c] || []).find(r => r.id === id);
function diffBooks(a, b){
  const p = {}; let n = 0;
  for (const c of COLS){
    const A = new Map((a[c] || []).filter(r => keepRec(c, r)).map(r => [r.id, r])), out = [];
    for (const r of b[c] || []){ if (!keepRec(c, r)) continue; const o = A.get(r.id);
      if (!o) out.push([r.id, null, JSON.parse(JSON.stringify(r))]);
      else { if (recSig(o) !== recSig(r)) out.push([r.id, o, JSON.parse(JSON.stringify(r))]); A.delete(r.id); } }
    A.forEach((o, id) => out.push([id, o, null]));

  const ba = a.budgets || {}, bb = b.budgets || {}, bu = [];
  new Set([...Object.keys(ba), ...Object.keys(bb)]).forEach(k => { if ((ba[k] ?? null) !== (bb[k] ?? null)) bu.push([k, ba[k] ?? null, bb[k] ?? null]); });

}
const inversePatch = p => Object.fromEntries(Object.entries(p).map(([c, rows]) => [c, rows.map(([id, b, a]) => [id, a, b])]));
const isMoney = p => !!(p && (p.tx || p.loans || p.items));
const touches = (p, id) => Object.values(p || {}).some(rows => rows.some(r => r[0] === id));
/* Whether a change can be applied in a direction now: what it expects must
   still be there, untouched, and nothing may be left pointing at a record
   that would be gone. Returns why not, or null. */
function patchCheck(p, dir){
  const set = {}; COLS.forEach(c => { set[c] = new Map((p[c] || []).map(([id, b, a]) => [id, dir < 0 ? b : a])); });
  for (const c of COLS) for (const [id, b, a] of p[c] || []) if (recSig(findRec(c, id) || null) !== recSig((dir < 0 ? a : b) || null)) return { why: "it has changed since", id };
  for (const [k, b, a] of p.budgets || []) if ((S.budgets[k] ?? null) !== (dir < 0 ? a : b)) return { why: "that limit has changed since", id: k };

  for (const [id, b, a] of p.items || []) if (!(dir < 0 ? b : a) && S.tx.some(t => t.itemId === id && will("tx", t.id))) return { why: "entries have been added to that item since" };
  for (const [id, b, a] of p.tx || []){ const t = dir < 0 ? b : a; if (!t) continue;
    if (t.accountId && !will("accounts", t.accountId)) return { why: "its account no longer exists" };
    if (t.toAccountId && !will("accounts", t.toAccountId)) return { why: "an account it moves money into no longer exists" };
    if (t.loanId && !will("loans", t.loanId)) return { why: "its loan no longer exists" };
    if (t.itemId && !will("items", t.itemId)) return { why: "its item no longer exists" }; }

}
function patchApply(p, dir){
  for (const c of COLS) for (const [id, b, a] of p[c] || []){ const want = dir < 0 ? b : a, i = S[c].findIndex(r => r.id === id);
    if (want){ const r = JSON.parse(JSON.stringify(want)); if (i >= 0) S[c][i] = r; else S[c].push(r); } else if (i >= 0) S[c].splice(i, 1); }

}
function logAdd(h){ if (log.some(e => e.id === h.id)) return; const e = { id: h.id, label: h.label, at: h.at, patch: h.patch }, i = log.findIndex(x => x.at < h.at);
  if (i < 0) log.push(e); else log.splice(i, 0, e); if (log.length > 300) log.length = 300; }

/* An undo-from-the-log on the line of changes marks the old change undone,
   and taking that undo back clears the mark; a redo the other way round. */
function refMark(h, dir){ const x = log.find(e => e.id === h.ref); if (!x) return; x.undone = (h.kind === "undo") === (dir > 0) ? Date.now() : null; }
function saveJournal(){
  const cut = past.map(h => !!h.whole).lastIndexOf(true), stack = past.slice(cut + 1).slice(-5).map(({ id, label, at, patch, ref, kind }) => ({ id, label, at, patch, ref, kind }));
  try{ if (!stack.length && !log.length) localStorage.removeItem(JOURNAL); else localStorage.setItem(JOURNAL, JSON.stringify({ v: 1, stack, log })); }catch(e){}
}
function loadJournal(){
  try{ const j = JSON.parse(localStorage.getItem(JOURNAL) || "null"); if (!j || j.v !== 1) return;
    (j.stack || []).forEach(h => { if (h && h.patch) past.push(h); }); (j.log || []).forEach(e => { if (e && e.patch) log.push(e); }); }catch(e){}
}
/* How much of each monthly limit this month has used, to notice a crossing. */
const budgetUse = () => { const m = today().slice(0, 7), f = flows(m + "-01", monthEnd(m));
  return new Map(Object.entries(S.budgets || {}).filter(([, lim]) => lim > 0).map(([id, lim]) => [id, (f.byCat.get(id) || 0) / lim * 100])); };
function commit(label, fn, o = {}){
  const before = JSON.stringify(S), was = S, open0 = S.loans.filter(l => loanDue(l) > 0).map(l => l.id), use0 = budgetUse();
  let out;
  try{ out = fn(S); }
  catch(e){ S = JSON.parse(before); bump(); render(); toast("That was not saved: the record has changed, perhaps on another device.", { tone: "neg" }); return; }
  const whole = S !== was;
  stamp({ whole });
  bump(); accrue(); save(); bump();
  const h = { id: uid("c"), label, at: Date.now() };
  if (whole){ h.whole = true; h.before = before; h.logBefore = log.splice(0); }
  else { h.patch = diffBooks(JSON.parse(before), S); if (o.ref){ h.ref = o.ref; h.kind = o.kind; refMark(h, 1); } else if (isMoney(h.patch)) logAdd(h); }

  const over = [];
  if (!whole){
    ui.settled = open0.filter(id => { const l = S.loans.find(x => x.id === id); return l && loanDue(l) === 0; });
    ui.pulse = new Map();
    budgetUse().forEach((p, id) => { const p0 = use0.get(id) || 0;
      if (p0 < 100 && p >= 100){ ui.pulse.set(id, p0 >= 80 ? "warn" : "pos"); const c = catOf(id); over.push(c ? c.name : "a category"); }
      else if (p0 < 80 && p >= 80) ui.pulse.set(id, "pos"); });
  }
  countNext = true; render();

}
/* Undo and redo walk the line of changes. Several at once are quiet, and say
   how many when they are done. A change that can no longer be taken back
   says why, and stays where it is. */
function undo(o = {}){
  const h = past[past.length - 1];
  if (!h){ if (!o.quiet) toast("Nothing to undo."); return false; }
  if (h.whole){ past.pop(); future.push({ ...h, after: JSON.stringify(S), logAfter: log.splice(0, log.length, ...(h.logBefore || [])) }); S = JSON.parse(h.before); }
  else { const no = patchCheck(h.patch, -1); if (no){ if (!o.quiet) toast("“" + h.label + "” cannot be undone: " + no.why + ".", { tone: "neg" }); return false; }
    past.pop(); patchApply(h.patch, -1); future.push(h); if (h.ref) refMark(h, -1); else logDrop(h.id); }

  if (!o.quiet){ render(); toast("Undone · " + h.label + (h.patch ? moneyNote(inversePatch(h.patch)) : "")); }
  scheduleSync(); return true;
}
function redo(o = {}){
  const f = future[future.length - 1];
  if (!f){ if (!o.quiet) toast("Nothing to redo."); return false; }
  if (f.whole){ future.pop(); past.push({ ...f, before: JSON.stringify(S), logBefore: log.splice(0, log.length, ...(f.logAfter || [])) }); S = JSON.parse(f.after); }
  else { const no = patchCheck(f.patch, 1); if (no){ if (!o.quiet) toast("“" + f.label + "” cannot be redone: " + no.why + ".", { tone: "neg" }); return false; }
    future.pop(); patchApply(f.patch, 1); past.push(f); if (f.ref) refMark(f, 1); else if (isMoney(f.patch)) logAdd(f); }
  stamp(); bump(); accrue(); save(); bump(); saveJournal(); countNext = true;
  if (!o.quiet){ render(); toast("Redone · " + f.label + (f.patch ? moneyNote(f.patch) : "")); }
  scheduleSync(); return true;
}
loadJournal();


/* =============================================================================
   4. THE BOOKS
   ============================================================================= */
const catOf = id => S.categories.find(c => c.id === id);
const accOf = id => S.accounts.find(a => a.id === id);
const SIGN = { expense:-1, income:1, lend:-1, lend_repay:1, borrow:1, borrow_repay:-1, buy:-1, item_cost:-1, sell:1 };
/* What a transaction does to the account it is booked against. */
const effect = t => t.kind === "adjust" ? t.amount : t.kind === "transfer" ? -t.amount : (SIGN[t.kind] || 0) * t.amount;
/* Where a change moved money: each account it touched, and by how much. */
function moneyNote(p){
  if (!p || !p.tx) return "";
  const m = new Map();
  for (const [, b, a] of p.tx){ if (a) txEffects(a).forEach((v, k) => m.set(k, (m.get(k) || 0) + v)); if (b) txEffects(b).forEach((v, k) => m.set(k, (m.get(k) || 0) - v)); }
  const says = [...m].filter(([, v]) => v).map(([k, v]) => (accOf(k) ? accOf(k).name : "An account") + " " + money(v, { plus: true }));
  /* A loan with no account linked moves only what is owed; saying nothing
     there reads as if the money was lost on the way. */
  if (!says.length && p.tx.some(([, b, a]) => { const t = a || b; return t && (t.loanId || t.itemId) && !t.accountId; })) return " · no account moved";
  return says.length ? " · " + says.slice(0, 2).join(", ") + (says.length > 2 ? "…" : "") : "";
}
/* What an entry does to each account it touches: a transfer to two of them. */
const txEffects = t => { const m = new Map([[t.accountId, effect(t)]]); if (t.kind === "transfer" && t.toAccountId) m.set(t.toAccountId, (m.get(t.toAccountId) || 0) + t.amount); m.delete(""); m.delete(undefined); return m; };

function balancesAt(date){
  return cached("bal:" + (date || ""), () => {
    const m = new Map(S.accounts.map(a => [a.id, a.opening || 0]));
    for (const t of S.tx){
      if (date && t.date > date) continue;
      if (t.accountId && m.has(t.accountId)) m.set(t.accountId, m.get(t.accountId) + effect(t));
      if (t.kind === "transfer" && t.toAccountId && m.has(t.toAccountId)) m.set(t.toAccountId, m.get(t.toAccountId) + t.amount);
    }
    return m;
  });
}
const balanceOf = id => balancesAt(null).get(id) || 0;
const loanPaid = (l, date) => S.tx.reduce((s, t) =>
  t.loanId === l.id && (t.kind === "lend_repay" || t.kind === "borrow_repay") && (!date || t.date <= date) ? s + t.amount : s, 0);
const loanDue = (l, date) => (date && l.date > date) ? 0 : Math.max(0, l.principal - loanPaid(l, date));
/* An item bought to sell is a record (its name, the price hoped for, a note)
   with entries of its own: what was paid for it, costs added since, and the
   sale. Until it is sold it counts in net worth at what it cost, so buying
   moves money out of an account without moving net worth. The price hoped
   for never counts; net worth moves on the sale, by the profit or the loss. */
const itemOf = id => (S.items || []).find(x => x.id === id);
const itemParts = it => cached("item:" + it.id, () => { const own = S.tx.filter(t => t.itemId === it.id);
  return { buy: own.find(t => t.kind === "buy"), costs: own.filter(t => t.kind === "item_cost").sort((a, b) => a.date < b.date ? -1 : 1), sale: own.find(t => t.kind === "sell"), n: own.length }; });
const itemCost = (it, date) => S.tx.reduce((s, t) => t.itemId === it.id && (t.kind === "buy" || t.kind === "item_cost") && (!date || t.date <= date) ? s + t.amount : s, 0);
const itemHeld = (it, date) => { const sale = itemParts(it).sale; return sale && (!date || sale.date <= date) ? 0 : itemCost(it, date); };
const pctTxt = (a, b) => { const n = b ? Math.round(a / b * 100) : 0; return (n < 0 ? "−" : "") + Math.abs(n) + "%"; };
/* Lending moves money out of an account and into a receivable, so net worth
   does not move; it moves when the loan is written off, never when it is made. */
function netWorthAt(date){
  return cached("nw:" + (date || ""), () => {
    let n = 0;
    balancesAt(date).forEach(v => { n += v; });
    for (const l of S.loans) n += (l.dir === "lent" ? 1 : -1) * loanDue(l, date);
    for (const it of S.items || []) n += itemHeld(it, date);
    return n;
  });
}
/* Interest is added every day. Each day an account with a rate earns its
   balance at the start of that day times rate / 365. A month's interest is one
   entry ("Interest") that grows by a day's worth each day and is dated the
   last day counted; once the month is over it is finished and left alone.
   It counts from the day the rate was set and is never backdated. Its id is
   fixed per account and month, so two devices make the same entry, not two. */
const interestId = (a, m) => "t_int_" + a.id + "_" + m;
/* A rate is a year's percentage, either flat or tiered: one rate on the
   balance up to an amount (cap) and another (rate2) on the part above it, as
   some savings accounts pay. 20% withholding tax comes off all interest, as
   banks in the Philippines take it before it reaches the account. */
const TAX = .2;
const earns = a => a.rate > 0 || (a.cap > 0 && a.rate2 > 0);
const yearly = (a, b) => { b = Math.max(0, b); return a.cap > 0 ? (Math.min(b, a.cap) * (a.rate || 0) + Math.max(0, b - a.cap) * (a.rate2 || 0)) / 100 : b * (a.rate || 0) / 100; };
const rateText = a => a.cap > 0 ? (a.rate || 0) + "% up to " + compact(a.cap) + ", " + (a.rate2 || 0) + "% above" : a.rate + "% a year";
const afterTax = g => g - Math.round(g * TAX);
function accrue(){
  const t = today(), ym = t.slice(0, 7); let changed = false;
  for (const a of S.accounts){
    if (a.archived || !earns(a)) continue;
    /* The first day's interest is earned on the day after the rate is set, so
       setting a rate (or importing an account) never moves today's balance. */
    if (!a.interestFrom){ a.interestFrom = addDays(t, 1); changed = true; }
    if (a.interestFrom > t) continue;
    for (let m = a.interestFrom.slice(0, 7); m <= ym; m = addMonths(m, 1)){
      const id = interestId(a, m), own = S.tx.find(x => x.id === id), last = m < ym ? monthEnd(m) : t;
      if (m < ym && own && own.date === last){
        /* A month finished before tax was taken off holds the gross figure, so
           the tax comes off it once. It is not worked out again: a rate changed
           since must not rewrite a month that has closed. */
        if (own.tax == null){ const tax = Math.round(own.amount * TAX); Object.assign(own, { gross: own.amount, tax, amount: own.amount - tax, note: (own.note || "Interest") + ", less 20% tax" }); changed = true; bump(); }
        continue; }
      let sum = 0;
      for (let d = a.interestFrom > m + "-01" ? a.interestFrom : m + "-01"; d <= last; d = addDays(d, 1)){
        const prev = addDays(d, -1), start = (balancesAt(prev).get(a.id) || 0) - (own && own.date <= prev ? own.amount : 0);
        sum += yearly(a, start) / 365;
      }
      const gross = Math.round(sum), tax = Math.round(gross * TAX), amount = gross - tax, note = "Added daily at " + rateText(a) + ", less 20% tax";
      if (amount <= 0){ if (own){ S.tx = S.tx.filter(x => x !== own); changed = true; bump(); } continue; }
      if (own && own.amount === amount && own.tax === tax && own.date === last && own.note === note) continue;
      if (own) Object.assign(own, { amount, gross, tax, date: last, note });
      else S.tx.push({ id, created: new Date().toISOString(), kind: "income", amount, gross, tax, date: last, desc: "Interest", note, category: catOf("interest") ? "interest" : "", accountId: a.id, toAccountId: "", auto: "interest" });
      changed = true; bump();
    }
  }
  if (changed) stamp();
  return changed;
}

function flows(from, to){
  return cached("fl:" + from + ":" + to, () => {
    let inc = 0, exp = 0, n = 0; const byCat = new Map(), byDesc = new Map();
    for (const t of S.tx){
      if (t.date < from || t.date > to) continue;
      if (t.kind === "income"){ inc += t.amount; n++; }
      else if (t.kind === "expense"){
        exp += t.amount; n++;
        const c = t.category || "other"; byCat.set(c, (byCat.get(c) || 0) + t.amount);
        const d = (t.desc || "Untitled").trim(); byDesc.set(d, (byDesc.get(d) || 0) + t.amount);
      }
    }
    return { inc, exp, n, byCat, byDesc };
  });
}

const PERIODS = { "this-month":"This month", "last-month":"Last month", "30d":"Last 30 days", "90d":"Last 90 days",
                  "ytd":"Year to date", "12m":"Last 12 months", "all":"All time" };
/* A single month can be a period too, when a chart's month is opened. It keeps
   its capitals wherever a period is named mid-sentence. */
const lower = r => /^m:/.test(r.key) ? r.label : r.label.toLowerCase();

function range(key){
  const t = today(), ym = t.slice(0, 7);
  if (/^m:\d{4}-\d{2}$/.test(key)){ const m = key.slice(2), p = addMonths(m, -1);
    return { key, from: m + "-01", to: monthEnd(m), prev: { from: p + "-01", to: monthEnd(p), label: "vs " + MON[parse(p + "-01").getMonth()] }, label: fmtMonth(m) }; }

  let from, to = t, prev = null;
  if (key === "this-month"){ from = ym + "-01"; to = monthEnd(ym); }
  else if (key === "last-month"){ const p = addMonths(ym, -1); from = p + "-01"; to = monthEnd(p); }
  else if (key === "30d") from = addDays(t, -29);
  else if (key === "90d") from = addDays(t, -89);
  else if (key === "ytd") from = t.slice(0, 4) + "-01-01";
  else if (key === "12m") from = addMonths(ym, -11) + "-01";
  else from = S.tx.reduce((m, x) => x.date < m ? x.date : m, t);
  if (key === "this-month" || key === "last-month"){
    const p = addMonths(from.slice(0, 7), -1); prev = { from: p + "-01", to: monthEnd(p), label: "vs " + MON[parse(p + "-01").getMonth()] };
  } else if (key !== "all"){
    const len = daysBetween(from, to) + 1; const pTo = addDays(from, -1);
    prev = { from: addDays(pTo, -(len - 1)), to: pTo, label: "vs prior period" };
  }
  return { key, from, to, prev, label: PERIODS[key] || PERIODS["this-month"] };
}

/* Words for a transaction, wherever one is listed. */
const KIND_LABEL = { expense:"Expense", income:"Income", transfer:"Transfer", lend:"Loan out", lend_repay:"Repayment in",
                     borrow:"Loan in", borrow_repay:"Repayment out", adjust:"Adjustment", buy:"Item bought", item_cost:"Item cost", sell:"Item sold" };
const signedAmount = t => t.kind === "transfer" ? t.amount : effect(t);
function txTitle(t){
  const it = t.itemId && itemOf(t.itemId);
  if (it) return t.kind === "item_cost" ? (t.desc ? t.desc + " for " : "Cost of ") + it.name : (t.kind === "sell" ? "Sold " : "Bought ") + it.name;
  if (t.desc) return t.desc;
  if (t.kind === "transfer") return "Transfer";
  const l = t.loanId && S.loans.find(x => x.id === t.loanId);
  if (l) return ({ lend:"Lent to ", lend_repay:"Repayment from ", borrow:"Borrowed from ", borrow_repay:"Repayment to " }[t.kind] || "") + l.person;
  return KIND_LABEL[t.kind] || "Transaction";
}
function txAccountText(t){
  const a = accOf(t.accountId);
  if (t.kind === "transfer"){ const b = accOf(t.toAccountId); return (a ? a.name : "—") + " → " + (b ? b.name : "—"); }
  return a ? a.name : "—";
}

const icon = (n, s = 16) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATH[n] || ""}</svg>`;

function niceScale(max){
  if (max <= 0) return { max: 100, step: 25 };
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  return { max: Math.ceil(max / step) * step, step };
}
const tipAttr = (title, lines) => `data-tip="${esc([title].concat(lines.map(l => l.join("\u001f"))).join("\u001e"))}"`;

/* Money in beside money out, month by month. */
/* Type inside a drawing shrinks with it. So a drawing is made as wide as the
   card it goes in, and a 12px label is 12px on the screen. `share` is the part
   of the page the card takes while the window is wider than `below`. */
const plotW = (share, below) => { const real = document.documentElement.clientWidth, vw = real / zoomNow(), wide = real > 820, split = real > below;
  const page = Math.min(1160, vw - (wide ? 264 : 0)) - (vw > 1180 ? 80 : wide ? 56 : 32);
  return Math.round(Math.max(280, Math.min(720, (page - (split ? 20 : 0)) * (split ? share : 1) - (wide ? 40 : 32)))); };
function chartCashflow(rows, o = {}){
  const W = o.w || 660, H = W < 420 ? 210 : 236, L = 54, R = 8, T = 12, B = 26, pw = W - L - R, ph = H - T - B;
  const skip = W < 500 && rows.length > 8 ? 2 : 1;
  const sc = niceScale(Math.max(1, ...rows.map(r => Math.max(r.inc, r.exp))));
  const y = v => T + ph - (v / sc.max) * ph, bw = pw / Math.max(1, rows.length), w = Math.min(14, bw * .26);
  let g = "";
  for (let v = 0; v <= sc.max + 1; v += sc.step)
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis val" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${compact(v)}</text>`;
  rows.forEach((r, i) => {
    const x = L + i * bw, cx = x + bw / 2;
    g += `<g class="col"${r.ym ? ` data-act="drill-month" data-key="${r.ym}"` : ""} ${tipAttr(r.label, [["Money in", money(r.inc)], ["Money out", money(r.exp)], ["Net", money(r.inc - r.exp, { plus:true })]])}>` +
      `<rect class="hit" x="${x}" y="${T}" width="${bw}" height="${ph}" rx="6"/>` +
      `<rect class="bar-in" x="${cx - w - 2}" y="${y(r.inc)}" width="${w}" height="${Math.max(0, T + ph - y(r.inc))}" rx="3"/>` +
      `<rect class="bar-out" x="${cx + 2}" y="${y(r.exp)}" width="${w}" height="${Math.max(0, T + ph - y(r.exp))}" rx="3"/>` +
      ((rows.length - 1 - i) % skip ? "" : `<text class="axis" x="${cx}" y="${H - 7}" text-anchor="middle">${esc(r.short)}</text>`) + "</g>";
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Money in and out by month">${g}</svg>`;
}

/* One line over time, on a scale that includes zero only when the data does. */
function chartArea(points, o = {}){
  const W = o.w || 660, H = o.h || (W < 420 ? 210 : 236), L = o.bare ? 0 : 54, R = o.bare ? 0 : 8, T = o.bare ? 6 : 12, B = o.bare ? 2 : 26;
  if (points.length < 2) return "";
  const vals = points.map(p => p.v); let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi){ lo -= 100; hi += 100; }
  const padv = (hi - lo) * .12; lo -= padv; hi += padv;
  const pw = W - L - R, ph = H - T - B;
  const x = i => L + (i / (points.length - 1)) * pw, y = v => T + ph - ((v - lo) / (hi - lo)) * ph;
  const d = points.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const id = "g" + Math.random().toString(36).slice(2, 7);
  let g = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c, var(--accent-ink));stop-opacity:.2"/><stop offset="1" style="stop-color:var(--c, var(--accent-ink));stop-opacity:0"/></linearGradient></defs>`;
  if (!o.bare){
    for (let k = 0; k <= 4; k++){ const v = lo + (hi - lo) * k / 4;
      g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis val" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${compact(v)}</text>`; }
    const every = Math.ceil(points.length / (W < 500 ? 4 : 6));
    points.forEach((p, i) => { if (i % every === 0 || i === points.length - 1)
      g += `<text class="axis" x="${x(i)}" y="${H - 7}" text-anchor="${i === 0 ? "start" : i === points.length - 1 ? "end" : "middle"}">${esc(p.short)}</text>`; });
  }
  if (o.base) g += `<line class="base" x1="${L}" x2="${W - R}" y1="${y(points[0].v).toFixed(1)}" y2="${y(points[0].v).toFixed(1)}"/>`;
  g += `<path d="${d} L${x(points.length - 1).toFixed(1)} ${T + ph} L${x(0).toFixed(1)} ${T + ph} Z" fill="url(#${id})"/><path class="line" d="${d}"/>`;
  if (!o.bare || o.tips){
    const cw = pw / (points.length - 1);
    points.forEach((p, i) => { g += `<g class="col" ${tipAttr(p.label, [[o.name || "Value", money(p.v)]])}><rect class="hit" x="${Math.max(L, x(i) - cw / 2)}" y="${T}" width="${Math.min(W - R, x(i) + cw / 2) - Math.max(L, x(i) - cw / 2)}" height="${ph}"/></g>`; });
    if (!o.bare) g += `<circle class="dot" cx="${x(points.length - 1)}" cy="${y(points[points.length - 1].v)}" r="4"/>`;
  }
  return `<svg class="chart ${o.cls || ""}" viewBox="0 0 ${W} ${H}" ${o.tone || o.color ? 'style="--c:' + (o.color || "var(--" + o.tone + ")") + '"' : ""} ${o.bare ? 'preserveAspectRatio="none"' : ""} role="img" aria-label="${esc(o.name || "Trend")}">${g}</svg>`;
}

function delta(cur, prev, o = {}){
  if (!prev) return "";
  const d = (cur - prev) / Math.abs(prev) * 100, up = d >= 0, good = o.invert ? !up : up;
  /* No change is not good news or bad news, so it is not coloured as either. */

  return `<span class="delta ${good ? "pos" : "neg"}">${up ? "+" : "−"}${Math.abs(d) >= 1000 ? "999" : Math.abs(d).toFixed(1)}%</span>`;
}

/* Toasts stack, the newest in front and the older ones peeking out above it.
   Pointing at the stack fans it out and holds every timer; a toast can be
   swiped away. An Undo toast shows how long is left to press it. The stack is
   made on first use, so a toast asked for early in loading still works. */
function makeToasts(){
  const host = $("#toasts"), list = [];
  let open = false;
  function layout(){
    if (!host) return;
    const n = list.length, fh = n ? list[n - 1].h : 0;

/* ---------- accounts -------------------------------------------------------- */

/* ---------- loans ----------------------------------------------------------- */

    return d < 0 ? `<span class="neg">${-d} ${d === -1 ? "day" : "days"} overdue</span>` : d === 0 ? `<span class="warn">today</span>` : d <= 7 ? `<span class="warn">in ${d} ${d === 1 ? "day" : "days"}</span>` : ""; };
  const lead = (list, none) => { if (!list.length) return none; const n = list.find(x => x.l.due);
    return list.length + " open" + (n ? " · next " + esc(n.l.person) + ", " + (late(n.l) || fmtDate(n.l.due)) : ""); };
  const card = ({ l, paid, due }) => { const pct = l.principal ? Math.round(paid / l.principal * 100) : 0, out = l.dir === "lent";

    return `<article class="panel acct loan">

/* The rate that turns the interest received over a period into a year's
   percentage. With a tier, the part above the cap earns its own rate first,
   and what is left is the rate up to the cap. */
function calcRate(f){
  const g = n => f.querySelector(`[name="${n}"]`), per = g("calcPer").value, days = { day: 1, month: 365 / 12, quarter: 365 / 4, year: 365 }[per] || 365 / 12;
  const got = toCents(g("calcAmt").value || ""), bal = toCents(g("calcBal").value || g("opening").value || "");
  if (!(got > 0)) return { msg: "Enter the gross interest and the balance it was earned on." };
  if (!(bal > 0)) return { msg: "Enter the balance it was earned on." };
  const cap = f.querySelector('[name="tiered"][value="on"]').checked ? toCents(g("cap").value || "") : 0, over = cap > 0 && bal > cap;
  const r = (got * 365 / days - (over ? (bal - cap) * (parseFloat(g("rate2").value) || 0) / 100 : 0)) / (over ? cap : bal) * 100;
  if (!(r > 0) || r > 100) return { msg: "That comes to " + (Number.isFinite(r) ? r.toFixed(2) : "?") + "% a year, which cannot be right. Check the figures." };
  return { r: Math.round(r * 100) / 100, msg: money(got) + " a " + per + " on " + money(bal) + " is " + r.toFixed(2) + "% a year" + (over ? " on the first " + money(cap, { round: true }) : "") + "." };
}
function calcPaint(f){ const c = calcRate(f), b = f.querySelector('[data-act="calc-use"]'); f.querySelector(".calc-out").textContent = c.msg; b.disabled = !c.r; b.textContent = c.r ? "Use " + c.r + "%" : "Use this rate"; }

  if (r.bottom > b.bottom - 8) sc.scrollTo({ top: sc.scrollTop + r.bottom - b.bottom + 16, behavior: how }); else if (r.top < b.top + 8) sc.scrollTo({ top: sc.scrollTop - (b.top - r.top) - 16, behavior: how }); };

/* A card opens into its sheet and the sheet closes back into the card, so it
   is plain where it came from. On a phone it is a bottom sheet. */
const fromRect = (card, d) => { const a = card.getBoundingClientRect(), z = d.getBoundingClientRect(), k = zoomNow();
  return `translate(${(a.left - z.left) / k}px, ${(a.top - z.top) / k}px) scale(${a.width / z.width}, ${a.height / z.height})`; };
const cardOf = (kind, id) => { const b = $(`#view [data-act="${kind === "loan" ? "loan-sheet" : kind === "item" ? "item-sheet" : "acct-sheet"}"][data-id="${id}"]`); return b && b.closest(".acct"); };
const sheetMoves = () => !phone() && !reduceMotion() && !document.hidden;
function openSheet(kind, id, card){
  ui.sheet = { kind, id }; ui.sheetAll = false; paintSheet();
  const morph = !adlg.open && card && sheetMoves();
  if (!adlg.open){ adlg.style.animation = morph ? "none" : ""; adlg.showModal(); }
  const b = adlg.querySelector(".sheet-b"); if (b) b.scrollTop = 0;
  if (morph){ adlg.style.transformOrigin = "0 0";
    const a = adlg.animate([{ transform: fromRect(card, adlg), opacity: .35 }, { transform: "none", opacity: 1 }], { duration: 360, easing: "cubic-bezier(.32,.72,0,1)" });
    /* style.animation stays "none" until the sheet closes: clearing it here
       would restart the ordinary fade-in and flash the sheet. */
    let done = false; const finish = () => { if (done) return; done = true; a.cancel(); adlg.style.transformOrigin = ""; };
    a.finished.then(finish, finish); setTimeout(finish, 440); }
}
function closeSheet(){
  if (!adlg.open) return;
  const s = ui.sheet || {}, card = cardOf(s.kind, s.id);
  if (!card || !sheetMoves()) return adlg.close();
  adlg.style.transformOrigin = "0 0";
  /* Out is quicker than in. */
  const a = adlg.animate([{ transform: "none", opacity: 1 }, { transform: fromRect(card, adlg), opacity: 0 }], { duration: 220, easing: "cubic-bezier(.4,0,1,1)", fill: "forwards" });
  /* Closed when the motion ends, or on a timer if frames are not running: a
     sheet must never be left open because an animation stalled. */
  let done = false; const finish = () => { if (done) return; done = true; adlg.close(); a.cancel(); adlg.style.transformOrigin = ""; };
  a.finished.then(finish, finish); setTimeout(finish, 300);
}

/* The line under an item's form says, as it is typed, what the entry will do:
   which account moves, and what that makes the profit. */
function itemLive(f){
  const out = f && f.querySelector(".form-live"); if (!out) return;
  const g = n => (f.querySelector(`[name="${n}"]`) || {}).value || "", acc = id => accOf(id) ? accOf(id).name : "", a = toCents(g("amount")), it = f.dataset.id ? itemOf(f.dataset.id) : null;
  const moves = (id, c) => id ? esc(acc(id)) + " " + money(c, { plus: c > 0 }) : "No account moves";
  const tone = c => c < 0 ? "neg" : "pos";
  if (f.dataset.form === "item"){ const e = toCents(g("expect")), extra = it ? itemCost(it) - ((itemParts(it).buy || {}).amount || 0) : 0, cost = (a > 0 ? a : 0) + extra;
    out.innerHTML = !(a > 0) ? "Enter what you paid. It comes out of the account below, and net worth does not move: the money is now in the item, at what you paid."
      : moves(g("accountId"), -a) + ". " + (e > 0 ? `Expected profit <b class="${tone(e - cost)}">${money(e - cost, { plus: true })}</b> · ${pctTxt(e - cost, cost)} on ${extra ? money(cost) + " with extras" : "what you paid"}.` : "Add the price you expect, and the card shows the profit it would make.");
    return; }
  if (!it) return;
  if (f.dataset.form === "sell"){ const cost = itemCost(it), fees = toCents(g("fees")) || 0, net = a - fees, p = net - cost, vs = it.expect ? net - it.expect : null;
    out.innerHTML = !(a > 0) ? "Enter what it sold for." : moves(g("accountId"), net) + `. ${p < 0 ? "Loss" : "Profit"} <b class="${tone(p)}">${money(p, { plus: true })}</b> · ${pctTxt(p, cost)} on ${money(cost)}`
      + (vs === null ? "." : vs === 0 ? ", as you expected." : `, <b class="${tone(vs)}">${money(Math.abs(vs))}</b> ${vs > 0 ? "more" : "less"} than you expected.`) + ` Net worth moves by the ${p < 0 ? "loss" : "profit"}.`;
    return; }
  if (f.dataset.form === "itemcost"){ const old = f.dataset.tx ? ((S.tx.find(t => t.id === f.dataset.tx) || {}).amount || 0) : 0, total = itemCost(it) - old + (a > 0 ? a : 0), sale = itemParts(it).sale;

function openLoan(id, pre = {}){
  const had = toCents(pre.amount);
  const l = S.loans.find(x => x.id === id) || { dir: pre.dir || ui.lastDir, person: "", principal: had > 0 ? had : 0, date: pre.date || today(), due: "", note: pre.note || "", accountId: pre.accountId || firstAccount() };
  draft = null;
  openDialog(`<form data-form="loan" data-id="${id || ""}">${head(id ? "Edit loan" : "New entry")}<div class="dlg-b">
    ${id ? "" : kindSeg("loan", true)}
    <div class="seg" role="radiogroup" aria-label="Direction">${[["lent", "I lent"], ["borrowed", "I borrowed"]].map(([k, t]) => `<label><input type="radio" name="dir" value="${k}" ${l.dir === k ? "checked" : ""} ${id ? "disabled" : ""}><span>${t}</span></label>`).join("")}</div>
    ${amountBox(l.principal ? fromCents(l.principal) : "")}
    <div class="fields">
      ${field("Person", `<input class="input" name="person" value="${esc(l.person)}" placeholder="Who" autocomplete="off" required>`, { full: true })}
      ${field("Date", `<input class="input" type="date" name="date" value="${esc(l.date)}">`)}
      ${field("Due (optional)", `<input class="input" type="date" name="due" value="${esc(l.due || "")}">`)}
      ${field(`<span class="dir-lent">Lent from</span><span class="dir-borrowed">Borrowed into</span>`, `<select class="input" name="accountId">${accountOptions(l.accountId)}<option value="" ${l.accountId ? "" : "selected"}>No account: moves no money</option></select>`)}
      ${field("Notes", `<textarea class="input" name="note" rows="2" placeholder="Optional">${esc(l.note || "")}</textarea>`, { full: true })}
    </div><div class="err" role="alert"></div></div>
    ${foot(id ? "Save" : "Record loan", id ? `<button type="button" class="btn btn-ghost btn-danger" data-act="delete-loan" data-id="${id}">${icon("trash", 14)}Delete</button>` : "")}</form>`);
}
function openPay(loanId, t){
  const l = S.loans.find(x => x.id === loanId); if (!l) return;
  const due = loanDue(l) + (t ? t.amount : 0);
  openDialog(`<form data-form="pay" data-id="${loanId}" data-tx="${t ? t.id : ""}">${head(t ? "Edit payment" : "Log payment")}<div class="dlg-b">
    <p class="muted">${l.dir === "lent" ? esc(l.person) + " owes you" : "You owe " + esc(l.person)} <b class="num" style="color:var(--ink)">${money(due)}</b>.</p>
    ${amountBox(fromCents(t ? t.amount : due))}
    <div class="fields">${field("Date", `<input class="input" type="date" name="date" value="${t ? esc(t.date) : today()}">`)}
      ${(() => { const sel = t ? t.accountId : (l.accountId || firstAccount()); return field(l.dir === "lent" ? "Paid into" : "Paid from", `<select class="input" name="accountId">${accountOptions(sel)}<option value="" ${sel ? "" : "selected"}>No account: moves no money</option></select>`); })()}
      ${field("Note", `<input class="input" name="note" value="${t ? esc(t.note || "") : ""}" placeholder="Optional" autocomplete="off">`, { full: true })}</div>
    <div class="err" role="alert"></div></div>
    ${foot(t ? "Save" : "Log payment", t ? `<button type="button" class="btn btn-ghost btn-danger" data-act="delete-tx" data-id="${t.id}">${icon("trash", 14)}Delete</button>` : "")}</form>`);
}

/* ---- a category ---- */
function openCategory(id){
  const c = catOf(id) || { name: "", kind: "expense", color: PALETTE[S.categories.length % PALETTE.length] }, used = id && S.tx.some(t => t.category === id);
  openDialog(`<form data-form="category" data-id="${id || ""}">${head(id ? "Edit category" : "New category")}<div class="dlg-b"><div class="fields">
    ${field("Name", `<input class="input" name="name" value="${esc(c.name)}" autocomplete="off" required autofocus>`, { full: true })}
    ${field("Used for", `<select class="input" name="kind" ${id ? "disabled" : ""}>${options([["expense", "Expenses"], ["income", "Income"]], c.kind)}</select>`)}
    <div class="field"><span>Colour</span><div class="row" style="flex-wrap:wrap;gap:6px">${PALETTE.map(p => `<label class="swatch"><input type="radio" name="color" value="${p}" ${p === c.color ? "checked" : ""} class="sr"><span style="background:${p}"></span></label>`).join("")}</div></div>
    </div><div class="err" role="alert"></div></div>
    ${foot(id ? "Save" : "Add category", id && !used ? `<button type="button" class="btn btn-ghost btn-danger" data-act="delete-category" data-id="${id}">${icon("trash", 14)}Delete</button>` : (id ? `<span class="desc-sub">In use, so it cannot be deleted</span>` : ""))}</form>`);
}

/* What each form does when it is submitted. */
const FORMS = {
  confirm(){ const fn = onConfirm; closeDialog(); if (fn) fn(); },
  "loan-notes"(fd, form){ const id = form.dataset.id, l = S.loans.find(x => x.id === id), note = String(fd.get("note") || "").trim();
    closeDialog(); if (!l || note === (l.note || "")) return;
    commit(note ? "Notes saved" : "Notes cleared", s => { s.loans.find(x => x.id === id).note = note; }); },
  item(fd, form){
    const id = form.dataset.id, amount = toCents(fd.get("amount")), name = String(fd.get("name") || "").trim(), raw = String(fd.get("expect") || "").trim(), expect = raw ? toCents(raw) : 0;
    if (!(amount > 0)) return fail(form, "Enter what you paid for it.");
    if (!name) return fail(form, "Say what the item is.");
    if (!(expect >= 0)) return fail(form, "Enter the price you expect as a number, or leave it empty.");
    const was = id && itemOf(id), sale = was && itemParts(was).sale, date = fd.get("date") || today();
    if (sale && date > sale.date) return fail(form, "It was sold on " + fmtDate(sale.date, true) + ", so it was bought before that.");
    const rec = { amount, date, accountId: String(fd.get("accountId") || "") }, note = String(fd.get("note") || "").trim(), now = new Date().toISOString();
    closeDialog(); commit(id ? "Item updated" : "Item added", s => {
      s.items = s.items || [];
      if (id){ Object.assign(s.items.find(x => x.id === id), { name, expect, note });
        const b = s.tx.find(t => t.itemId === id && t.kind === "buy");
        if (b) Object.assign(b, rec); else s.tx.push({ id: uid("t"), created: now, kind: "buy", desc: "", note: "", category: "", toAccountId: "", itemId: id, ...rec }); }
      else { const it = { id: uid("i"), name, expect, note, created: now }; s.items.push(it); ui.loanTab = "holding"; ui.loanPage = 1; if (ui.route === "loans") history.replaceState(null, "", "#/loans/holding");
        s.tx.push({ id: uid("t"), created: now, kind: "buy", desc: "", note: "", category: "", toAccountId: "", itemId: it.id, ...rec }); }

  },
  sell(fd, form){
    const it = itemOf(form.dataset.id); if (!it) return closeDialog();
    const txId = form.dataset.tx, price = toCents(fd.get("amount")), raw = String(fd.get("fees") || "").trim(), fees = raw ? toCents(raw) : 0, date = fd.get("date") || today(), p = itemParts(it);

    closeDialog(); commit(txId ? "Sale updated" : it.name + " sold", s => { const old = txId && s.tx.find(t => t.id === txId);
      if (old) Object.assign(old, rec); else s.tx.push({ id: uid("t"), created: new Date().toISOString(), kind: "sell", desc: "", category: "", toAccountId: "", itemId: it.id, ...rec }); });
  },
  itemcost(fd, form){
    const it = itemOf(form.dataset.id); if (!it) return closeDialog();

  "item-notes"(fd, form){ const id = form.dataset.id, it = itemOf(id), note = String(fd.get("note") || "").trim();

    commit(note ? "Notes saved" : "Notes cleared", s => { s.items.find(x => x.id === id).note = note; }); },
  "budget-add"(fd, form){ const name = String(fd.get("name") || "").trim(), lim = toCents(fd.get("amount")), low = name.toLowerCase();

  "budget-edit"(fd, form){ const id = form.dataset.id, name = String(fd.get("name") || "").trim(), lim = toCents(fd.get("amount"));
    if (!name) return fail(form, "Give the budget a name.");
    if (!(lim > 0)) return fail(form, "Enter a monthly limit above zero, or remove the budget.");

  /* The token is read from the field once and the field is repainted empty. */

  tx(fd, form){

    if (!(amount > 0)) return fail(form, "Enter an amount greater than zero.");
    if (!accountId) return fail(form, "Choose an account.");
    if (kind === "transfer" && !to) return fail(form, "Choose the account it goes to.");
    if (kind === "transfer" && to === accountId) return fail(form, "Choose two different accounts.");
    const rec = { kind, amount, date: fd.get("date") || today(), note: (fd.get("note") || "").trim(), accountId,

    });
  },
  adjust(fd, form){
    const amount = toCents(fd.get("amount")), id = form.dataset.id;
    if (!amount) return fail(form, "Enter an amount other than zero.");
    closeDialog(); commit("Adjustment updated", s => Object.assign(s.tx.find(t => t.id === id), { amount, date: fd.get("date") || today(), note: (fd.get("note") || "").trim() }));
  },
  account(fd, form){
    const name = (fd.get("name") || "").trim(), id = form.dataset.id, opening = toCents(fd.get("opening") || "0"), rate = parseFloat(fd.get("rate")) || 0;
    const tiered = fd.get("tiered") === "on", cap = tiered ? toCents(fd.get("cap") || "") : 0, rate2 = tiered ? parseFloat(fd.get("rate2")) || 0 : 0;
    if (!name) return fail(form, "Give the account a name.");
    if (rate < 0 || rate > 100 || rate2 < 0 || rate2 > 100) return fail(form, "A rate is a percentage a year, between 0 and 100.");
    if (tiered && !(cap > 0)) return fail(form, "Give the balance the rate is paid up to, or untick the tiered rate.");
    if (Number.isNaN(opening)) return fail(form, "The opening balance is not a number.");
    closeDialog(); commit(id ? "Account updated" : "Account added", s => {
      const was = id && s.accounts.find(a => a.id === id), p = PLACES.find(x => x[0] === fd.get("where")), rec = { name, type: p ? p[2] : was ? was.type : "bank", ...(p ? { where: p[0] } : {}), opening, rate, cap: tiered ? cap : 0, rate2, ...(earns({ rate, cap, rate2 }) && !(was && earns(was)) ? { interestFrom: addDays(today(), 1) } : {}) };
      if (id) Object.assign(s.accounts.find(a => a.id === id), rec); else s.accounts.push({ id: uid("a"), archived: false, ...rec });
    });
  },
  reconcile(fd, form){
    const id = form.dataset.id, actual = toCents(fd.get("actual")), a = accOf(id);
    if (Number.isNaN(actual)) return fail(form, "Enter the balance as a number.");
    const diff = actual - balanceOf(id);
    if (!diff){ closeDialog(); toast("Already matches — nothing to book."); return; }
    closeDialog(); commit("Adjustment of " + money(diff, { plus: true }) + " booked", s => s.tx.push({ id: uid("t"), created: new Date().toISOString(), kind: "adjust", amount: diff,
      date: fd.get("date") || today(), desc: a.type === "investment" ? "Market revaluation" : "Reconciliation", note: (fd.get("note") || "").trim(), category: "", accountId: id, toAccountId: "" }));
  },
  loan(fd, form){
    const id = form.dataset.id, principal = toCents(fd.get("amount")), person = (fd.get("person") || "").trim();
    if (!(principal > 0)) return fail(form, "Enter the amount of the loan.");
    if (!person) return fail(form, "Say who the loan is with.");
    const old = S.loans.find(l => l.id === id);
    if (old && principal < loanPaid(old)) return fail(form, "That is less than the " + money(loanPaid(old)) + " already paid.");
    const rec = { person, principal, date: fd.get("date") || today(), due: fd.get("due") || "", note: (fd.get("note") || "").trim(), accountId: fd.get("accountId") || "" };
    closeDialog(); commit(id ? "Loan updated" : "Loan recorded", s => {
      if (id){ const l = s.loans.find(x => x.id === id); Object.assign(l, rec);
        const origin = s.tx.find(t => t.loanId === id && (t.kind === "lend" || t.kind === "borrow"));
        if (origin) Object.assign(origin, { amount: principal, date: rec.date, accountId: rec.accountId });
      } else { const dir = fd.get("dir") === "borrowed" ? "borrowed" : "lent", l = { id: uid("l"), dir, ...rec }; s.loans.push(l); ui.lastDir = dir; ui.loanTab = dir; if (ui.route === "loans") history.replaceState(null, "", "#/loans/" + dir);
        s.tx.push({ id: uid("t"), created: new Date().toISOString(), kind: dir === "lent" ? "lend" : "borrow", amount: principal, date: rec.date, desc: "", note: "", category: "", accountId: rec.accountId, toAccountId: "", loanId: l.id }); }
    });
  },
  pay(fd, form){
    const l = S.loans.find(x => x.id === form.dataset.id), txId = form.dataset.tx, amount = toCents(fd.get("amount"));
    const old = txId && S.tx.find(t => t.id === txId), room = loanDue(l) + (old ? old.amount : 0);
    if (!(amount > 0)) return fail(form, "Enter an amount greater than zero.");
    if (amount > room) return fail(form, "That is more than the " + money(room) + " outstanding.");
    const rec = { amount, date: fd.get("date") || today(), accountId: fd.get("accountId") || "", note: (fd.get("note") || "").trim() };
    closeDialog(); commit(amount === room ? "Loan settled" : "Payment recorded", s => {
      if (old) Object.assign(s.tx.find(t => t.id === txId), rec);
      else { ui.landed = uid("t"); s.tx.push({ id: ui.landed, created: new Date().toISOString(), kind: l.dir === "lent" ? "lend_repay" : "borrow_repay", desc: "", category: "", toAccountId: "", loanId: l.id, ...rec }); }
    });
  },
  category(fd, form){
    const name = (fd.get("name") || "").trim(), id = form.dataset.id;
    if (!name) return fail(form, "Give the category a name.");

      else s.categories.push({ id: uid("c"), name, kind: fd.get("kind") === "income" ? "income" : "expense", color: fd.get("color") || PALETTE[0] });
    });
  }
};

function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text], { type })), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const csvCell = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function exportCSV(){
  const rows = [["Date", "Type", "Description", "Category", "Account", "To account", "Amount", "Note"]].concat(filtered().map(t =>
    [t.date, KIND_LABEL[t.kind], txTitle(t), (catOf(t.category) || {}).name || "", (accOf(t.accountId) || {}).name || "", (accOf(t.toAccountId) || {}).name || "", fromCents(signedAmount(t)), t.note || ""]));
  download("spend-tracker-transactions-" + today() + ".csv", rows.map(r => r.map(csvCell).join(",")).join("\r\n"), "text/csv");
  toast("Exported " + (rows.length - 1).toLocaleString() + " entries.");
}
/* The earlier version of this app (Spendly), translated: from one of its
   backup files, or straight from this device the first time this version
   opens where it ran.
   - Its balances are stored figures (an opening figure plus every movement);
     here they are worked out from the entries. So each account's opening is
     solved for, and every account lands on exactly what it was showing.
   - Every record keeps an id made from its old one, so two devices bringing
     the same records across make the same records, and sync joins them rather
     than doubling them. The time each was last changed comes too, so where
     the two differ the newer one wins.
   - Investments become items: what was paid, the price expected, and the
     sale with its fee taken off. That version kept no date of sale, so the
     last time the record changed stands in for it, and the sale says so.
   - A loan whose remaining amount is more than its original less its
     payments (interest added there) keeps that remaining amount. */
function fromSpendly(d){
  const out = blank(), c = v => Math.round((Number(v) || 0) * 100), str = v => typeof v === "string" ? v : "";
  const list = v => Array.isArray(v) ? v.filter(x => x && typeof x === "object") : [];
  const key = (p, r, i) => p + "_" + (String(r && r.id != null ? r.id : "n" + i).replace(/[^\w-]/g, "") || "n" + i);
  const stamp = r => { const t = r && r.updatedAt ? Date.parse(r.updatedAt) : NaN; return Number.isFinite(t) ? t : 0; };
  const day = v => /^\d{4}-\d{2}-\d{2}/.test(str(v)) ? str(v).slice(0, 10) : "";
  const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "x";
  const cat = (name, kind) => { const n = str(name).trim() || (kind === "income" ? "Other income" : "Other");
    let x = out.categories.find(k => k.kind === kind && k.name.toLowerCase() === n.toLowerCase());
    if (!x){ let id = "spc_" + kind[0] + "_" + slug(n), k = 2; while (out.categories.some(q => q.id === id)) id = "spc_" + kind[0] + "_" + slug(n) + "_" + k++;
      x = { id, name: n, kind, color: PALETTE[out.categories.length % PALETTE.length] }; out.categories.push(x); }
    return x.id; };
  (Array.isArray(d.categories) ? d.categories : []).forEach(n => { if (typeof n === "string" && n.trim()) cat(n, "expense"); });
  /* Accounts, and the figure each was showing. */
  const savings = list(d.savings), ops = list(d.balanceOps), byName = new Map(), target = new Map();
  const firstNamed = n => savings.find(a => a.provider === n);
  savings.forEach((a, i) => { const name = str(a.provider) || "Account", id = key("spa", a, i), p = PLACES.find(x => x[1].toLowerCase() === name.toLowerCase());
    const rate = Math.max(0, Number(a.rate) || 0), tiered = !!a.tiered && Number(a.tierCap) > 0;
    out.accounts.push({ id, name, type: p ? p[2] : /cash/i.test(name) ? "cash" : /wallet|gcash|maya|pay/i.test(name) ? "wallet" : "bank", ...(p ? { where: p[0] } : {}),
      opening: 0, rate, ...(tiered ? { cap: c(a.tierCap), rate2: Math.max(0, Number(a.tierOverRate) || 0) } : {}), ...(rate > 0 ? { interestFrom: addDays(today(), 1) } : {}), archived: false, u: stamp(a) });
    if (!byName.has(name.toLowerCase())) byName.set(name.toLowerCase(), id);
    let shown = c(a.amount);
    if (a.opening != null){ shown = c(a.opening); ops.forEach(o => { if (o.accountId ? o.accountId === a.id : o.account && firstNamed(o.account) === a) shown += c(o.delta); }); }
    target.set(id, shown); });
  const acc = n => { const t = str(n); if (!t) return ""; const i = savings.findIndex(a => a.provider === t); return i >= 0 ? key("spa", savings[i], i) : byName.get(t.toLowerCase()) || ""; };
  /* Spending and income. */
  const byOld = new Map();
  const entry = (e, kind, i) => { const t = { id: key(kind === "expense" ? "spx" : "spi", e, i), created: str(e.updatedAt), kind, amount: c(e.amount), date: day(e.date) || today(),
      desc: str(e.description), note: str(e.notes), category: cat(e.category, kind), accountId: acc(e.bank), toAccountId: "", u: stamp(e) };
    if (t.amount > 0){ out.tx.push(t); if (e.id != null) byOld.set(e.id, t); } };
  list(d.expenses).forEach((e, i) => entry(e, "expense", i)); list(d.incomes).forEach((e, i) => entry(e, "income", i));
  /* Loans, each with the entry that moved its money and every payment. */
  const loan = (l, dir, i) => { const id = key(dir === "lent" ? "spl" : "spb", l, i), u = stamp(l), date = day(l.dateGiven || l.dateTaken || l.date) || today();
    const pays = list(l.payments).map(p => ({ p, a: Math.max(0, c(p.amount)) })).filter(x => x.a > 0), paid = pays.reduce((s, x) => s + x.a, 0);
    const left = l.status === "repaid" ? 0 : Math.max(0, c(l.amount)), principal = Math.max(c(l.originalAmount != null ? l.originalAmount : l.amount), paid + left);
    if (!(principal > 0)) return;
    const note = [str(l.notes), str(l.reference) ? "Reference: " + str(l.reference) : ""].filter(Boolean).join("\n");

  const moved = new Map();

function importFile(file){
  const r = new FileReader();
  r.onerror = () => toast("That file could not be read.", { tone: "neg" });
  r.onload = () => {
    let d; try{ d = JSON.parse(r.result); }catch(e){ toast("That is not a backup file.", { tone: "neg" }); return; }
    let next = null, what = "";
    if (d && d.v === 1 && Array.isArray(d.tx) && Array.isArray(d.accounts)){ const b = blank(); next = { ...b, ...d, settings: { ...b.settings, ...(d.settings || {}) } }; what = "this backup"; }
    else if (d && (Array.isArray(d.expenses) || Array.isArray(d.savings) || Array.isArray(d.incomes))){ next = fromSpendly(d); what = "this backup from the earlier version"; }
    if (!next){ toast("That file is not a backup this app understands.", { tone: "neg" }); return; }
    const apply = () => { commit("Imported " + next.tx.length.toLocaleString() + " entries", () => { S = next; }); applyTheme(); go("overview"); };
    if (!S.tx.length && !S.accounts.length) return apply();
    confirmDialog({ title: "Replace what is here?", text: "Importing " + what + " replaces every account, entry, loan and budget currently on this device. You can undo it straight after." + (syncOn() ? " Records already in your sync gist come back on the next sync." : ""), action: "Replace", danger: true }, apply);
  };
  r.readAsText(file);
}

    g = (op[0] === ">" ? "Entries over " : op[0] === "<" ? "Entries under " : op === "=" ? "Entries of exactly " : "Entries of about ") + money(v, { round: v % 100 === 0 }); }
  else if (q.length >= 2) list = S.tx.filter(t => { const c = catOf(t.category); return (txTitle(t) + " " + (t.desc || "") + " " + (t.note || "") + " " + (c ? c.name : "") + " " + txAccountText(t)).toLowerCase().includes(q); });

/* =============================================================================
   10b. SYNC - optional. The books go to one place only: a private gist on the
   person's own GitHub account, and only once a token has been given here.
   The token is kept under its own key, outside the books, so it can never be
   part of a backup, an export or the gist itself.
   ============================================================================= */
const SYNC_KEY = "opus.generated.sync", GIST_FILE = "opus-generated-books.json", API = "https://api.github.com";
const readSync = () => { try{ return JSON.parse(localStorage.getItem(SYNC_KEY) || "null") || {}; }catch(e){ return {}; } };
let sync = readSync(), syncBusy = false, syncAgain = false, syncT = 0, stale = false;
const syncOn = () => !!(sync.token && sync.gist);
const saveSync = () => { try{ if (sync.token) localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); else localStorage.removeItem(SYNC_KEY); }catch(e){} };
/* What travels: the records and the limits. Theme, density, currency and the
   chosen period belong to each device and stay on it. */
function syncPayload(d){
  const out = { app: "opus-generated", v: 1, sample: !!(d.meta && d.meta.sample), budgets: d.budgets || {}, budgetU: d.budgetU || {}, gone: d.gone || {} };
  SYNCED.forEach(k => { out[k] = d[k] || []; });
  return out;
}
/* Two devices holding the same books must agree that they do, whatever order
   their lists are in - or each reads the other's order as a change and they
   overwrite each other for ever. So the comparison sorts; the gist keeps the
   order the person arranged. */
const canonical = v => Array.isArray(v) ? "[" + v.map(canonical).join(",") + "]"
  : v && typeof v === "object" ? "{" + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ":" + canonical(v[k])).join(",") + "}"
  : JSON.stringify(v === undefined ? null : v);
const byId = (a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
function canon(d, recordsOnly){
  const o = { budgets: d.budgets || {} };
  SYNCED.forEach(k => { o[k] = [...(d[k] || [])].sort(byId); });
  if (!recordsOnly){ o.gone = d.gone || {}; o.budgetU = d.budgetU || {}; }
  return canonical(o);
}
/* An entry changed in two places keeps the later change. One deleted anywhere
   stays deleted - unless it was changed again after the deletion. Merging A
   into B gives the same books as B into A. */
function mergeBooks(mine, theirs){
  const gone = { ...(theirs.gone || {}) };
  Object.entries(mine.gone || {}).forEach(([id, t]) => { if (!(gone[id] >= t)) gone[id] = t; });
  const out = { ...mine, gone };
  SYNCED.forEach(k => {
    const there = new Map((theirs[k] || []).map(r => [r.id, r])), seen = new Set(), list = [];
    (mine[k] || []).forEach(r => { const o = there.get(r.id); seen.add(r.id); list.push(o && (o.u || 0) > (r.u || 0) ? o : r); });
    (theirs[k] || []).forEach(r => { if (!seen.has(r.id)) list.push(r); });
    out[k] = list.filter(r => !(gone[r.id] > (r.u || 0)));
  });
  const a = mine.budgetU || {}, b = theirs.budgetU || {};
  out.budgets = {}; out.budgetU = {};
  new Set([...Object.keys(mine.budgets || {}), ...Object.keys(theirs.budgets || {}), ...Object.keys(a), ...Object.keys(b)]).forEach(c => {
    const src = (b[c] || 0) > (a[c] || 0) ? theirs : mine, v = (src.budgets || {})[c];
    out.budgetU[c] = Math.max(a[c] || 0, b[c] || 0);
    if (v > 0) out.budgets[c] = v;
  });
  return out;
}
/* GitHub, asked directly. The token goes in a header, never in an address. */
async function gh(method, path, body, token = sync.token){
  let res;
  try{ res = await fetch(API + path, { method, cache: "no-store", headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + token, ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined }); }
  catch(e){ throw new Error("GitHub could not be reached. Sync will try again."); }
  if (!res.ok){ const e = new Error(res.status === 401 ? "GitHub no longer accepts the token. Connect again with a new one."
    : res.status === 403 ? "GitHub refused. The token may be missing the gist scope, or the hourly limit was reached."
    : res.status === 404 ? "The sync gist was not found. It may have been deleted on GitHub."
    : "GitHub answered " + res.status + ". Sync will try again."); e.status = res.status; throw e; }
  return res;
}
async function readGist(id, token){
  const g = await (await gh("GET", "/gists/" + encodeURIComponent(id), null, token)).json(), f = g.files && g.files[GIST_FILE];
  if (!f) return null;
  let d = null;
  try{ const text = f.truncated ? await (await fetch(f.raw_url, { cache: "no-store" })).text() : f.content; d = text ? JSON.parse(text) : null; }
  catch(e){ throw new Error("The file in the gist could not be read."); }
  if (d && d.app !== "opus-generated") throw new Error("The gist holds a file this app did not write. Sync is paused.");
