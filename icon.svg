<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The home-screen mark. Maskable icons get cropped to a circle on Android, so the
       glyph sits inside the safe zone (the middle 80%) and the teal runs edge to edge
       rather than floating on a transparent field. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <text x="256" y="256" fill="#0B0D10"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="272" font-weight="800" text-anchor="middle" dominant-baseline="central">$</text>
</svg>
